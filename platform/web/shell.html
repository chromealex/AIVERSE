<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AIVERSE</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1214; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(8% + 18px);
            box-sizing: border-box; color: #cfd6dc; font: 13px system-ui, sans-serif; pointer-events: none; z-index: 2; }
  /* Launch splash until the wasm runs (colours/logo from game.json "splash", injected by aiversebuild);
     the engine then draws its own animated splash on the same background. */
  #aiverse-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                background: var(--aiverse-splash-bg, #0f1214); transition: opacity .35s; z-index: 1; }
  #aiverse-splash img { display: none; width: var(--aiverse-splash-logo, 40vmin); max-height: 60vh; object-fit: contain;
                    animation: aiverse-pulse 1.6s ease-in-out infinite; }
  #aiverse-splash-bar { position: absolute; left: 30%; right: 30%; bottom: 8%; height: 6px; border-radius: 3px; overflow: hidden;
                    background: rgba(255, 255, 255, .18); }
  #aiverse-splash-bar div { width: 0; height: 100%; background: var(--aiverse-splash-bar, #e0b040); transition: width .2s; }
  @keyframes aiverse-pulse { 50% { transform: scale(1.04); } }
  /* Games without their own splash: the animated AIVERSE mark, as the engine's default loading screen draws it. */
  #aiverse-mark { display: none; width: 26vmin; --aiv-mark-ink: #ffffff; --aiv-mark-accent: #fe6f03; }
  #aiverse-mark .aiv-mark { width: 100%; height: auto; }
</style>
<script>
  // Native-plugin registry stub: plugin scripts may load before the engine; the engine takes over
  // AiversePlugins.emit at startup and replays queued events.
  window.AiversePlugins = window.AiversePlugins || { plugins: {}, queue: [],
    register: function (name, impl) { this.plugins[name] = impl; },
    emit: function (plugin, event, data) { this.queue.push([plugin, event, data]); } };
</script>
<!-- aiversebuild inserts the plugins' <script> tags right after this marker (comments don't survive minification) -->
<meta name="aiverse-plugin-scripts" content="">
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="aiverse-splash"><img id="aiverse-splash-logo" alt=""><div id="aiverse-mark"><!-- aiverse-loader:begin (tools/branding/logo/loader.py) -->
<svg class="aiv-mark" viewBox="0 60 1000 880" role="img" aria-label="Loading"><style>.aiv-mark{display:block;overflow:visible}.aiv-mark .aiv-b{fill:var(--aiv-mark-ink,#141210);opacity:0;animation:.55s cubic-bezier(.2,.7,.25,1) forwards}.aiv-mark .aiv-t{animation-name:aiv-t}.aiv-mark .aiv-l{animation-name:aiv-l;animation-delay:.1s}.aiv-mark .aiv-r{animation-name:aiv-r;animation-delay:.2s}.aiv-mark .aiv-d{fill:var(--aiv-mark-accent,#E9C3A4);opacity:0;transform-box:view-box;transform-origin:500px 588px;animation:aiv-d .5s .55s cubic-bezier(.2,.7,.25,1) forwards,aiv-p 1.6s 1.05s ease-in-out infinite}@keyframes aiv-t{from{opacity:0;transform:translate(0,-70px)}to{opacity:1;transform:none}}@keyframes aiv-l{from{opacity:0;transform:translate(-60px,32px)}to{opacity:1;transform:none}}@keyframes aiv-r{from{opacity:0;transform:translate(60px,32px)}to{opacity:1;transform:none}}@keyframes aiv-d{from{opacity:0;transform:rotate(-90deg) scale(.3)}to{opacity:1;transform:none}}@keyframes aiv-p{0%,100%{opacity:1;transform:none}50%{opacity:1;transform:scale(1.07)}}@media (prefers-reduced-motion:reduce){.aiv-mark .aiv-b,.aiv-mark .aiv-d{animation:none;opacity:1}}</style><polygon class="aiv-b aiv-t" points="500,94 373,179 373,476 500,397 627,476 627,179"/><polygon class="aiv-b aiv-l" points="433,741 147,907 23,833 23,719 307,561 307,663"/><polygon class="aiv-b aiv-r" points="567,741 853,907 977,833 977,719 693,561 693,663"/><polygon class="aiv-d" points="500,438 350,588 500,738 650,588"/></svg>
<!-- aiverse-loader:end --></div><div id="aiverse-splash-bar"><div></div></div></div>
<div id="status">Loading…</div>
<script>
  // URL query → command line, e.g. index.html?map=0&spectate → --map 0 --spectate
  function argsFromQuery() {
    var a = [];
    new URLSearchParams(location.search).forEach(function (v, k) { a.push('--' + k); if (v) a.push(v); });
    return a;
  }
  var splash = document.getElementById('aiverse-splash'), splashBar = document.querySelector('#aiverse-splash-bar div');
  if (window.AIVERSE_SPLASH && AIVERSE_SPLASH.logo) {
    var logo = document.getElementById('aiverse-splash-logo');
    logo.src = AIVERSE_SPLASH.logo; logo.style.display = 'block';
  } else if (!window.AIVERSE_SPLASH) {   // no "splash" block in game.json: the engine's own mark and colours
    document.getElementById('aiverse-mark').style.display = 'block';
    splash.style.background = '#0e0f11';
    splashBar.style.background = '#fe6f03';
  }
  // "Downloading data... (12345/67890)" from the .data preload drives the bar
  function splashProgress(t) {
    var m = /\((\d+)\/(\d+)\)/.exec(t || '');
    if (m && +m[2] > 0) splashBar.style.width = Math.min(100, 100 * m[1] / m[2]) + '%';
  }
  function hideSplash() {
    splashBar.style.width = '100%'; splash.style.opacity = 0;
    setTimeout(function () { splash.style.display = 'none'; }, 400);
  }
  if (!document.createElement('canvas').getContext('webgl2'))
    document.getElementById('status').textContent = 'Нужен браузер с поддержкой WebGL 2';
  var Module = {
    arguments: argsFromQuery(),
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { var s = document.getElementById('status'); s.textContent = t; s.style.display = t ? 'flex' : 'none'; splashProgress(t); },
    monitorRunDependencies: function (left) { if (!left) Module.setStatus(''); },
    onRuntimeInitialized: function () { Module.setStatus(''); hideSplash(); Module.canvas.focus(); }
  };
  window.onerror = function () { Module.setStatus('Error: see the browser console'); };
</script>
{{{ SCRIPT }}}
</body>
</html>
