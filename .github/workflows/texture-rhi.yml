name: Texture RHI focused verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/texture-rhi-unification
    paths:
      - 'engine/gfx/**'
      - 'engine/render/**'
      - 'tests/render/**'
      - 'tools/verify-texture-rhi.sh'
      - 'tools/texture-rhi-final-verify.sh'
      - '.github/workflows/texture-rhi.yml'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'engine/gfx/**'
      - 'engine/render/**'
      - 'apps/editor/windows/TextureResourcesWindow.cpp'
      - 'tests/render/**'
      - 'tools/verify-texture-rhi.sh'
      - 'tools/texture-rhi-final-verify.sh'
      - '.github/workflows/texture-rhi.yml'
      - 'CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: texture-rhi-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Linux texture / OpenEXR=${{ matrix.openexr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        openexr: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify texture script Bash syntax
        run: bash -n tools/verify-texture-rhi.sh
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 \
            libx11-dev libegl1-mesa-dev libgles2-mesa-dev libgl-dev \
            libvulkan-dev libopenexr-dev glslang-tools
      - name: Focused CMake configure / compile / CTest
        run: |
          chmod +x tools/verify-texture-rhi.sh
          tools/verify-texture-rhi.sh \
            --build-dir "${{ github.workspace }}/build/texture-rhi-ci" \
            --jobs 4 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAIVERSE_BUILD_CLIENT=OFF \
            -DAIVERSE_BUILD_EDITOR=OFF \
            -DAIVERSE_BUILD_HEADLESS=OFF \
            -DAIVERSE_BUILD_SERVER=OFF \
            -DAIVERSE_BUILD_TOOLS=OFF \
            -DAIVERSE_TEXTURE_WITH_OPENEXR=${{ matrix.openexr }}
      - name: Compile canonical VT sampler for OpenGL 3.3 and GLES 3.0
        run: |
          command -v glslangValidator
          ctest --test-dir build/texture-rhi-ci \
            --verbose --output-on-failure --no-tests=error \
            -R '^virtual_texture_sampling_glsl$'
      - name: Upload explicit build / CTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-rhi-linux-openexr-${{ matrix.openexr }}-logs
          path: build/texture-rhi-ci/verify-logs/
          if-no-files-found: warn

  vulkan-build:
    name: Vulkan compute compile + source CTests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify texture script Bash syntax
        run: bash -n tools/verify-texture-rhi.sh
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 \
            libx11-dev libegl1-mesa-dev libgles2-mesa-dev libgl-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools glslang-tools
      - name: Compile native Vulkan implementation and focused tests
        run: |
          chmod +x tools/verify-texture-rhi.sh
          tools/verify-texture-rhi.sh \
            --vulkan --jobs 4 \
            --build-dir "${{ github.workspace }}/build/texture-rhi-vulkan" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAIVERSE_BUILD_CLIENT=OFF \
            -DAIVERSE_BUILD_EDITOR=OFF \
            -DAIVERSE_BUILD_HEADLESS=OFF \
            -DAIVERSE_BUILD_SERVER=OFF \
            -DAIVERSE_BUILD_TOOLS=OFF \
            -DAIVERSE_VULKAN=ON
          # A zero CTest exit can still indicate a SKIPPED GPU scenario.
          grep -Ei 'vulkan_backend|passed|failed|skipped' \
            build/texture-rhi-vulkan/verify-logs/ctest.log || true
      - name: Compile canonical VT GLSL in Vulkan-focused build
        run: |
          command -v glslangValidator
          ctest --test-dir build/texture-rhi-vulkan \
            --verbose --output-on-failure --no-tests=error \
            -R '^virtual_texture_sampling_glsl$'
      - name: Upload build and Vulkan execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-rhi-vulkan-logs
          path: build/texture-rhi-vulkan/verify-logs/
          if-no-files-found: warn

  gles-gpu:
    name: GLES3 real EGL array and legacy upload readback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Mesa EGL / GLES3 development and software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 \
            libx11-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri
      - name: Configure native production GLES3 Texture2DArray GPU test
        run: |
          cmake -S . -B build/texture-gles-gpu -G Ninja \
            -DAIVERSE_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAIVERSE_BUILD_CLIENT=OFF \
            -DAIVERSE_BUILD_EDITOR=OFF \
            -DAIVERSE_BUILD_HEADLESS=OFF \
            -DAIVERSE_BUILD_SERVER=OFF \
            -DAIVERSE_BUILD_TOOLS=OFF \
            -DAIVERSE_TEXTURE_GLES_GPU_TESTS=ON
      - name: Compile native GLES3 array and legacy texture GPU fixture
        run: cmake --build build/texture-gles-gpu --target aiverse_gles_texture_array_gpu_test --parallel 4
      - name: Execute real Mesa GLES3 GPU readback (failure is not SKIP)
        run: |
          ctest --test-dir build/texture-gles-gpu --verbose --no-tests=error \
            -R '^gles_texture_array_gpu$' 2>&1 | tee build/texture-gles-gpu/gles-gpu-test.log
          grep -F 'PASS: native GLES3 texture-array mip/layer padded upload and state isolation' \
            build/texture-gles-gpu/gles-gpu-test.log
          ! grep -Eq '(^|[[:space:]])FAIL:' build/texture-gles-gpu/gles-gpu-test.log
      - name: Upload real-GLES test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-rhi-gles-gpu
          path: build/texture-gles-gpu/gles-gpu-test.log
          if-no-files-found: warn
