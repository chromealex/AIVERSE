name: AIVERSE Studio validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/editor/**'
      - 'engine/render/**'
      - 'engine/gfx/**'
      - '.github/workflows/studio-validation.yml'

jobs:
  editor-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux editor graphics headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libegl-dev libgles-dev libvulkan-dev
      - name: Configure editor and tests
        run: cmake -S . -B build/studio-ci -DCMAKE_BUILD_TYPE=Debug -DAIVERSE_BUILD_EDITOR=ON -DAIVERSE_BUILD_TESTS=ON
      - name: Build editor
        run: cmake --build build/studio-ci --target aiverse_editor --parallel 2
      - name: Build tests
        run: cmake --build build/studio-ci --target aiverse_tests --parallel 2
      - name: Run tests
        run: ctest --test-dir build/studio-ci --output-on-failure
