name: AIVERSE Studio validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/editor/**'
      - 'apps/studio-native/**'
      - 'apps/studio-web/**'
      - 'CMakeLists.txt'
      - 'engine/render/**'
      - 'engine/gfx/**'
      - '.github/workflows/studio-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  editor-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build HTML5 Studio frontend
        working-directory: apps/studio-web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Linux Studio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libx11-dev libegl-dev libgles-dev libvulkan-dev libwebkit2gtk-4.1-dev libsqlite3-dev mesa-vulkan-drivers xvfb xauth
      - name: Configure HTML5 Studio and tests
        run: cmake -S . -B build/studio-ci -DCMAKE_BUILD_TYPE=Debug -DAIVERSE_BUILD_EDITOR=OFF -DAIVERSE_BUILD_TESTS=ON -DAIVERSE_BUILD_STUDIO_HTML5=ON
      - name: Build Studio
        run: cmake --build build/studio-ci --config Debug --target aiverse_studio --parallel 2
      - name: Build test suite and its dependencies
        run: cmake --build build/studio-ci --config Debug --parallel 2
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build/studio-ci -C Debug --output-on-failure --no-tests=error
      - name: Run tests on macOS and Windows
        if: runner.os != 'Linux'
        run: ctest --test-dir build/studio-ci -C Debug --output-on-failure --no-tests=error
