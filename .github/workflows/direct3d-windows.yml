name: Direct3D Windows acceptance

on:
  workflow_dispatch:
  push:
    branches: [codex/cpu-d3d-render-20261125]
    paths:
      - '.github/workflows/direct3d-windows.yml'
      - 'CMakeLists.txt'
      - 'engine/gfx/**'
      - 'tests/render/direct3d*.cpp'

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Record Windows and display adapters
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,PNPDeviceID
      - name: Configure x64 native tests
        run: cmake --preset windows-msvc -DAIVERSE_FETCH_TEMPLATES=OFF -DAIVERSE_ASSIMP=OFF -DAIVERSE_BUILD_STUDIO_HTML5=OFF
      - name: Build Direct3D test executables
        run: cmake --build build/windows-msvc --config Release --target aiverse_direct3d_device_tests aiverse_direct3d_rhi_tests --parallel 4
      - name: Exercise WARP, HAL and windowed resize
        run: |
          $inventory = ctest --test-dir build/windows-msvc -C Release -N -R '^render_direct3d'
          $inventory
          if (!($inventory -match 'Total Tests: 6$')) { throw 'Expected six registered Direct3D cases' }
          ctest --test-dir build/windows-msvc -C Release --verbose --output-on-failure --no-tests=error -R '^render_direct3d' --output-junit d3d-results.xml
          exit $LASTEXITCODE
      - name: Save CTest results and native process output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct3d-windows-results
          path: |
            build/windows-msvc/Testing/Temporary/LastTest.log
            build/windows-msvc/d3d-results.xml
            d3d-results.xml
          if-no-files-found: warn
