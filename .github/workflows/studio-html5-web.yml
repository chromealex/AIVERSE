name: AIVERSE HTML5 Studio checks
on:
  push:
    branches: [feature/studio-html5, feature/aiv20261124_texture_graph_gpu_slots]
    paths:
      - 'apps/studio-web/**'
      - 'apps/studio-native/**'
      - 'tools/studio/**'
      - 'apps/editor/core/**'
      - 'engine/pack/Sha256.*'
      - 'tools/mcp/**'
      - 'CMakeLists.txt'
      - '.github/workflows/studio-html5-web.yml'
  pull_request:
    paths:
      - 'apps/studio-web/**'
      - 'apps/studio-native/**'
      - 'tools/studio/**'
      - 'apps/editor/core/**'
      - 'engine/pack/Sha256.*'
      - 'tools/mcp/**'
      - 'CMakeLists.txt'
      - '.github/workflows/studio-html5-web.yml'
  workflow_dispatch:

permissions:
  contents: read

# Rapid AI iterations can trigger multiple pushes. Cancel stale checks.
concurrency:
  group: studio-html5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # npm cache needs package-lock.json. Do not enable until a pinned lockfile is committed.
      - name: Install frontend packages
        working-directory: apps/studio-web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/studio-web
        run: npm run typecheck
      - name: Docking and Inspector validation tests
        working-directory: apps/studio-web
        run: npm run test:web
      - name: Build static HTML5 frontend
        working-directory: apps/studio-web
        run: npm run build

      - name: Open the built interface in Linux WebKitGTK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb xauth
          c++ -std=c++20 -I. apps/studio-native/tests/StudioLinuxWebAssets.cpp -o "$RUNNER_TEMP/studio-webkit-test" $(pkg-config --cflags --libs webkit2gtk-4.1)
          xvfb-run -a "$RUNNER_TEMP/studio-webkit-test" "$PWD/apps/studio-web/dist"

  boundary:
    name: ImGui boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete dependency-light headless editor contracts
        run: bash tools/studio/verify_headless.sh

  macos-native:
    name: macOS HTML5 + Metal native compiler / contracts
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build HTML5 assets for WKWebView bundle
        working-directory: apps/studio-web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Configure experimental Studio
        run: |
          cmake -S . -B build/studio-native-ci \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAIVERSE_BUILD_EDITOR=OFF \
            -DAIVERSE_BUILD_CLIENT=OFF \
            -DAIVERSE_BUILD_TOOLS=ON \
            -DAIVERSE_BUILD_TESTS=ON \
            -DAIVERSE_BUILD_STUDIO_HTML5=ON
      - name: Compile Metal host and native contracts
        run: |
          cmake --build build/studio-native-ci \
            --target aiverse_studio aiversemcp aiverse_studio_owner_history_tests aiverse_studio_content_tests aiverse_studio_asset_catalog_tests aiverse_studio_asset_transfer_tests aiverse_studio_move_journal_tests aiverse_studio_visual_picking_tests aiverse_studio_model_picking_tests aiverse_studio_session_tests aiverse_studio_lighting_validation_tests aiverse_studio_material_validation_tests aiverse_studio_pbr_adapter_tests aiverse_studio_shader_graph_name_tests aiverse_studio_shader_graph_draft_tests aiverse_studio_light_preview_math_tests aiverse_studio_authored_lights_tests aiverse_studio_fps_lighting_contract_tests aiverse_studio_fps_lighting_document_tests aiverse_studio_scene_nodes_tests aiverse_studio_document_visuals_tests aiverse_studio_viewport_layout_tests aiverse_studio_terrain_tests aiverse_studio_render_lighting_tests \
            --parallel 3
      # studio_metal_lighting is left out: it opens an NSWindow and needs a Metal device.
      - name: Run native contract tests
        run: ctest --test-dir build/studio-native-ci --output-on-failure --no-tests=error -R '^studio_(standalone_bundle|content_directory|asset_catalog|asset_transfers|move_journal|visual_picking|model_picking|session|shader_graph_name|shader_graph_draft|pbr_adapter|material_validation|material_schema|lighting_validation|light_preview_math|authored_lights|fps_lighting_contract|fps_lighting_document|scene_nodes|document_visuals|viewport_layout|terrain_geometry|render_lighting|owner_history|mcp_registry)$'

  windows-native:
    name: Windows HTML5 + Vulkan native host (MSVC)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build HTML5 assets for the WebView2 host
        working-directory: apps/studio-web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Configure Studio (Visual Studio 2022, x64)
        run: cmake -S . -B build/studio-windows-ci -G "Visual Studio 17 2022" -A x64 -DAIVERSE_BUILD_EDITOR=OFF -DAIVERSE_BUILD_TOOLS=ON -DAIVERSE_BUILD_CLIENT=ON -DAIVERSE_CLIENT_BUNDLE_CONTENT=OFF -DAIVERSE_BUILD_TESTS=ON -DAIVERSE_BUILD_STUDIO_HTML5=ON
      - name: Build AiverseStudio.exe and the session contract
        run: cmake --build build/studio-windows-ci --config Release --target aiverse_studio aiversemcp aiverse_studio_owner_history_tests aiverse_studio_session_tests aiverse_studio_asset_transfer_tests aiverse_studio_move_journal_tests aiverse_studio_win_device_overlay_tests --parallel 4
      - name: Studio session contract (Windows)
        run: ctest --test-dir build/studio-windows-ci -C Release --output-on-failure --no-tests=error -R "^studio_(session|asset_transfers|move_journal|owner_history|mcp_registry|win_device_overlay)$"
      - name: Launch the staged Studio distribution and open a project
        shell: pwsh
        timeout-minutes: 4
        run: |
          $out = 'build/studio-windows-ci/apps/studio-native/Release'
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'Studio distribution')
          foreach ($file in 'AiverseStudio.exe','AiverseGame.exe','content','aiversemcp.exe','aiversebuild.exe','WebView2Loader.dll','studio-web','engine') {
            Copy-Item (Join-Path $out $file) $stage.FullName -Recurse
          }
          python -B apps/studio-native/tests/standalone_bundle.py --require-build-tool --require-windows-player $stage.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $project = Join-Path $env:RUNNER_TEMP 'Studio launch project'
          Copy-Item demos/order-upgrade $project -Recurse
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--force-renderer-accessibility'
          ./apps/studio-native/tests/windows_project_launch.ps1 -Package $stage.FullName -Project $project
      - uses: actions/upload-artifact@v4
        with:
          name: aiverse-studio-windows
          path: ${{ runner.temp }}/Studio distribution/
