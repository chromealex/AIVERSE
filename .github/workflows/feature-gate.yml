name: Feature gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  feature-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/feature_gate_test.py
      - run: python3 tools/agents/audit_compliance.py --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
