name: VIVID validation

on:
  push:
    branches:
      - feature/vivid-digital-humans
      - feature/vivid-human-safe-publication
    paths:
      - 'engine/character/vivid/**'
      - 'tests/vivid/**'
      - 'engine/render/ModelVertexStreamOverride.h'
      - 'engine/render/Model.cpp'
      - 'engine/render/Renderer3D.h'
      - 'engine/render/Renderer3DModels.cpp'
      - 'tools/vivid-validate.sh'
      - 'tools/vivid-creator/**'
      - '.github/workflows/vivid-validation.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: vivid-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native:
    name: macOS compile + VIVID / MotionWeave CTest
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build/vivid-ci -DAIVERSE_BUILD_TESTS=ON \
            -DAIVERSE_BUILD_CLIENT=OFF -DAIVERSE_BUILD_EDITOR=OFF \
            -DAIVERSE_BUILD_HEADLESS=OFF -DAIVERSE_BUILD_SERVER=OFF \
            -DAIVERSE_BUILD_TOOLS=OFF
      - name: Build VIVID / MotionWeave native tests
        run: |
          cmake --build build/vivid-ci -j 4 --target \
            aiverse_vivid_face_tests \
            aiverse_vivid_sparse_tests \
            aiverse_vivid_shape_tests \
            aiverse_vivid_morph_tests \
            aiverse_vivid_gpu_contract_tests \
            aiverse_vivid_metal_gpu_tests \
            aiverse_vivid_metal_rhi_tests \
            aiverse_vivid_vertex_override_tests \
            aiverse_vivid_actor_retirement_tests \
            aiverse_vivid_human_dna_tests \
            aiverse_vivid_human_rig_tests \
            aiverse_vivid_human_appearance_tests \
            aiverse_vivid_human_import_tests \
            aiverse_vivid_human_creator_tests \
            aiverse_vivid_creator \
            aiverse_vivid_motionweave_tests \
            aiverse_motionweave_api_tests
      - name: CTest (Metal may skip without physical GPU)
        run: |
          ctest --test-dir build/vivid-ci -R '^(vivid_|motionweave_api$)' \
            --output-on-failure -j 1
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivid-macos-test-logs
          path: build/vivid-ci/Testing/**
          if-no-files-found: ignore
