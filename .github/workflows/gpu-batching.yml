name: GPU batching focused regression

# AIVERSE has many concurrent agent branches. Never queue dozens of
# superseded raster checks for successive commits to the same PR.
# The current head remains authoritative; unrelated PRs run independently.
concurrency:
  group: gpu-batching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'engine/render/**'
      - 'engine/gfx/**'
      - 'apps/editor/windows/SceneWindow.cpp'
      - 'tests/render/model_batching_policy.cpp'
      - 'tests/render/material_batches.cpp'
      - '.github/workflows/gpu-batching.yml'
  workflow_dispatch:

jobs:
  model-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/gpu-batching
          -DAIVERSE_BUILD_TESTS=ON
          -DAIVERSE_BUILD_EDITOR=OFF
          -DAIVERSE_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build engine model-batching regression
        run: cmake --build build/gpu-batching --target aiverse_model_batching_policy_tests --parallel 4
      - name: Verify
        run: ctest --test-dir build/gpu-batching -R '^model_batching_policy$' --output-on-failure

  # This runs on the macOS GPU runner separately from the GPU-authored path.
  # The fixture renders 16 independent meshes with identical material GPU
  # state and distinct transforms, and compares Direct vs CPU-encoded ICB
  # pixel-for-pixel. No external GTA assets or an editor UI are needed.
  metal-cpu-mdi:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure GPU fixture
        run: >-
          cmake -S . -B build/metal-cpu-mdi
          -DAIVERSE_BUILD_HDR_TESTS=ON
          -DAIVERSE_BUILD_EDITOR=OFF
          -DAIVERSE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/metal-cpu-mdi --target aiverse_material_batches --parallel 4
      - name: Stage129 fixture topology and offline analyzer checks
        run: |
          bash -n tools/batching-stage129-trials.sh
          python3 -m py_compile tools/batching-stage127-analyze.py tools/batching-stage129-analyze.py
          python3 tools/batching-stage129-analyze.py --self-test
          build/metal-cpu-mdi/aiverse_material_batches --unit
      - name: Verify Direct vs CPU MDI raster output
        env:
          AIVERSE_METAL_CPU_MDI: '1'
          AIVERSE_METAL_MDI_MIN_COMMANDS: '2'
          AIVERSE_MDI_GEOMETRY_SORT: '1'
          AIVERSE_PALETTE_TEST_CASE: indirect
          AIVERSE_ICB_PROFILE: '1'
        run: |
          mkdir -p build/metal-cpu-mdi/captures
          build/metal-cpu-mdi/aiverse_material_batches unused.obj build/metal-cpu-mdi/captures/cpu-mdi
      - name: Verify cold vs warm persistent CPU packet raster
        env:
          AIVERSE_PERSISTENT_CPU_PACKETS: '1'
          AIVERSE_PALETTE_TEST_CASE: static_packets
          AIVERSE_MULTI_DRAW_INDIRECT: 'off'
        run: |
          # First image: no staticPacketRevision, dynamic path.
          # Second: same geometry, warmed persistent packet replay.
          # Fixture requires nonzero packet hits, matching draw counts
          # and byte-identical GPU screenshots, including sun shadows.
          build/metal-cpu-mdi/aiverse_material_batches unused.obj build/metal-cpu-mdi/captures/static-packets
      - name: Preserve CPU MDI before/after captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-cpu-mdi-captures
          path: build/metal-cpu-mdi/captures/*.ppm
          if-no-files-found: ignore

  metal-icb-gpu:
    # Regression exercises an actual Metal render pass and compares pixel output
    # with ICB off/on. It is separate from CPU policy tests.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure GPU fixture
        run: >-
          cmake -S . -B build/metal-icb
          -DAIVERSE_BUILD_HDR_TESTS=ON
          -DAIVERSE_BUILD_EDITOR=OFF
          -DAIVERSE_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build real Metal A/B fixture
        run: cmake --build build/metal-icb --target aiverse_material_batches --parallel 4
      - name: Compare actual GPU-encoded ICB against direct model draws
        env:
          AIVERSE_EXPERIMENTAL_METAL_ICB: '1'
          AIVERSE_GPU_AUTHORED_DRAWS: '1'
          AIVERSE_GPU_ENCODED_ICB: '1'
          AIVERSE_GPU_ICB_RIGID: '1'
          AIVERSE_GPU_ICB_MIN_COMMANDS: '2'
          AIVERSE_EXPECT_GPU_ICB: '1'
          AIVERSE_PALETTE_TEST_CASE: indirect
          AIVERSE_ICB_TRACE: '1'
        run: |
          mkdir -p build/metal-icb/captures
          build/metal-icb/aiverse_material_batches unused.obj build/metal-icb/captures/gpu-icb
      - name: Preserve GPU ICB before/after captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-gpu-icb-captures
          path: build/metal-icb/captures/*.ppm
          if-no-files-found: ignore
