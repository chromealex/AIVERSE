name: Building Style Focused

on:
  pull_request:
    paths:
      - 'libraries/include/aiverselib/systems/Building*.h'
      - 'libraries/include/aiverselib/systems/RuntimeBuildingGenerator.h'
      - 'libraries/include/aiverselib/systems/BuildingFeatureGenerator.h'
      - 'engine/assets/building-recipes/*.json'
      - 'tests/libraries/building_feature_tests.cpp'
      - 'tests/render/runtime_building_model_compile.cpp'
      - 'engine/assets/building-styles/*.json'
      - 'tools/buildings/**'
      - 'tests/libraries/building*'
      - 'engine/buildings/**'
      - 'apps/studio-native/StudioBuildingGeneration.h'
      - 'tests/studio/BuildingGenerationTests.cpp'
  workflow_dispatch:

# A single focused run per PR revision. The project-wide CI also runs on this
# PR; prevent duplicate queued push + pull_request jobs from starving it.
concurrency:
  group: building-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  model-preview-export:
    name: Export real procedural building models for visual QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone C++ building exporter
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wno-misleading-indentation -I. -Ilibraries/include \
            tools/buildings/building_style_export.cpp engine/core/Fixed.cpp engine/data/Json.cpp \
            -o /tmp/aiverse_building_export
      - name: Generate real sci-fi GLB models, two deterministic seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/building-preview
          for kind in barracks command factory depot; do
            for seed in 3 7; do
              /tmp/aiverse_building_export --style engine/assets/building-styles/scifi.json \
                --structure "$kind" --seed "$seed" \
                --out "build/building-preview/${kind}-seed${seed}.glb"
            done
          done
          # Functional property recipes are independent of architectural setting.
          for style in scifi modern; do
            /tmp/aiverse_building_export --style "engine/assets/building-styles/${style}.json" \
              --recipe engine/assets/building-recipes/multiuse-open.json \
              --out "build/building-preview/${style}-multiuse-open.glb"
          done
          # Validate the new constructive W/H/D solver separately without
          # losing default-model screenshots if it still fails some settings.
          for kind in barracks command factory depot; do
            if /tmp/aiverse_building_export --style engine/assets/building-styles/scifi.json \
               --structure "$kind" --size 28 15 24 --seed 42 \
               --out "build/building-preview/${kind}-28x15x24.glb"; then
              echo "sized ${kind}: OK"
            else
              echo "sized ${kind}: FAILED (constructive fit needs investigation)"
            fi
          done
          find build/building-preview -name '*.glb' -printf '%f %s bytes\n'
      - name: Real 20-building parametric size and seed QA
        shell: bash
        run: |
          python3 tools/buildings/qa_batch_20.py --root . \
            --exporter /tmp/aiverse_building_export \
            --out build/building-preview/batch-20 --allow-failures
      - name: Preserve 20-building meshes and structured QA reports
        uses: actions/upload-artifact@v4
        with:
          name: aiverse-building-batch-20
          path: |
            build/building-preview/batch-20/*.glb
            build/building-preview/batch-20/report.csv
            build/building-preview/batch-20/report.json
            build/building-preview/batch-20/view-*.command
          if-no-files-found: error
          retention-days: 7
      - name: Preserve raw GLB models for review and actual screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aiverse-sci-fi-building-glb
          path: build/building-preview/*.glb
          if-no-files-found: error
          retention-days: 7
  focused-building:
    name: Building style generator and GLB export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile only the building generator tests and exporter
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-std=c++20 -O1 -Wall -Wextra -Werror -Wno-misleading-indentation -pedantic -I. -Ilibraries/include"
          g++ $FLAGS tests/libraries/building_tests.cpp engine/core/Fixed.cpp engine/data/Json.cpp -o /tmp/aiverse_building_tests
          g++ $FLAGS tests/libraries/building_style_tests.cpp engine/core/Fixed.cpp engine/data/Json.cpp -o /tmp/aiverse_building_style_tests
          g++ $FLAGS tools/buildings/building_style_export.cpp engine/core/Fixed.cpp engine/data/Json.cpp -o /tmp/aiverse_building_export
          g++ $FLAGS tests/libraries/building_runtime_tests.cpp engine/core/Fixed.cpp engine/data/Json.cpp -o /tmp/aiverse_building_runtime_tests
          g++ $FLAGS tests/libraries/building_feature_tests.cpp engine/core/Fixed.cpp engine/data/Json.cpp -o /tmp/aiverse_building_feature_tests
          # Compile the Renderer3D adapter even without a live GPU in CI.
          g++ $FLAGS -fsyntax-only tests/render/runtime_building_model_compile.cpp
      - name: Run genre-neutral building regression tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/aiverse_building_tests
          /tmp/aiverse_building_style_tests "$GITHUB_WORKSPACE"
          /tmp/aiverse_building_runtime_tests "$GITHUB_WORKSPACE"
          /tmp/aiverse_building_feature_tests "$GITHUB_WORKSPACE"
      - name: Compile native Studio asset generation contract
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-std=c++20 -O1 -Wall -Wextra -Werror -Wno-misleading-indentation -pedantic -I. -Ilibraries/include"
          g++ $FLAGS tests/studio/BuildingGenerationTests.cpp apps/studio-native/StudioAssetCatalog.cpp \
            engine/core/Fixed.cpp engine/data/Json.cpp -lsqlite3 \
            -o /tmp/aiverse_studio_building_tests
      - name: Run native Studio content/GUID acceptance
        shell: bash
        run: /tmp/aiverse_studio_building_tests "$GITHUB_WORKSPACE"
      - name: Export four sci-fi functions at the requested exact envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aiverse-buildings
          for kind in barracks command factory depot; do
            /tmp/aiverse_building_export --style engine/assets/building-styles/scifi.json \
              --structure "$kind" --size 28 15 24 --seed 42 \
              --out "/tmp/aiverse-buildings/$kind.glb"
          done
      - name: Check GLB header, mesh bounds and distinct silhouettes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          meshes = []
          for path in sorted(pathlib.Path('/tmp/aiverse-buildings').glob('*.glb')):
              data = path.read_bytes()
              magic, version, length = struct.unpack_from('<III', data)
              assert magic == 0x46546c67 and version == 2 and length == len(data), path
              count, kind = struct.unpack_from('<II', data, 12)
              assert kind == 0x4e4f534a
              doc = json.loads(data[20:20+count])
              assert doc['meshes'] and doc['accessors'], path
              bounds = [a for a in doc['accessors'] if a.get('type') == 'VEC3' and 'min' in a and 'max' in a]
              assert bounds, path
              lo,hi = bounds[0]['min'],bounds[0]['max']
              assert all(abs(lo[i]) < .002 for i in range(3)), (path, lo)
              assert all(abs(hi[i]-[28.,15.,24.][i]) < .002 for i in range(3)), (path, hi)
              triangles = sum(a['count']//3 for a in doc['accessors'] if a.get('type') == 'SCALAR' and a.get('componentType') == 5125)
              assert 0 < triangles < 20000, (path, triangles)
              meshes.append((path.stem, triangles))
          assert len(meshes) == 4
          print('building focused GLB export:', meshes)
          PY
