syntax = "proto3";
package extraction_rts;
option csharp_namespace = "ExtractionRTS.Interop.Proto";

message Envelope {
  oneof msg {
    // Client → Server
    ConnectRequest     connect_request      = 1;
    Ping               ping                 = 2;
    WorldStateResponse world_state_response = 3;

    // Server → Client
    ConnectResponse    connect_response     = 10;
    PlayerJoined       player_joined        = 11;
    PlayerLeft         player_left          = 12;
    Pong               pong                 = 13;
    WorldStateRequest  world_state_request  = 14;
    ServerError        server_error         = 15;
  }
}

// Connection

message ConnectRequest {
  string client_uid    = 1;
  string room_id       = 2;
  string access_token  = 3;
}

message ConnectResponse {
  int32  actor_id       = 1;
  string room_id        = 2;
  int64  server_time_ms = 3;
  repeated PlayerInfo players = 4;
}

message PlayerInfo {
  int32  actor_id   = 1;
  string client_uid = 2;
}

message PlayerJoined { int32 actor_id = 1; string client_uid = 2; }
message PlayerLeft   { int32 actor_id = 1; }

message ServerError  { string message = 1; }

// Ping / Pong

message Ping { int64 client_send_time_ms = 1; }
message Pong { int64 server_time_ms = 1; int64 client_send_time_ms = 2; }

// World state sync

message WorldStateRequest {}

message WorldStateResponse { bytes payload = 1; }
