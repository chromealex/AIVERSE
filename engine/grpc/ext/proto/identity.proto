syntax = "proto3";
package extraction_rts.identity;
option csharp_namespace = "ExtractionRTS.Interop.Identity";

service IdentityService {
  // Authenticate or refresh tokens (single active session per user)
  rpc Token(TokenRequest) returns (TokenResponse);
  // Invalidate current session (requires auth)
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message TokenRequest {
  oneof grant {
    DeviceGrant device = 1;
    GoogleGrant google = 2;
    AppleGrant apple = 3;
    RefreshTokenGrant refresh_token = 4;
  }

  message DeviceGrant {
    string device_id = 1;
  }

  message GoogleGrant {
    string id_token = 1;
  }

  message AppleGrant {
    string authorization_code = 1;
    string id_token = 2;
  }

  message RefreshTokenGrant {
    string refresh_token = 1;
  }
}

message TokenResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_at = 4;
  int64 expires_in = 5;
}

message LogoutRequest {
}

message LogoutResponse {
}
